<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Modern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Config Tailwind Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom smooth transition for dark mode and cards */
        .transition-custom {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-custom">

    <!-- Navbar Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-custom">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-4">
                
                <!-- Logo & Judul -->
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-brand-500 text-white rounded-xl shadow-md">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-500 to-indigo-600 dark:from-sky-400 dark:to-indigo-400">
                        GaleriFoto
                    </h1>
                </div>

                <!-- Bilah Pencarian (Search Bar) -->
                <div class="flex-1 max-w-md hidden sm:block">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Cari foto, judul, atau fotografer..." 
                            class="w-full pl-9 pr-4 py-2 text-sm bg-gray-100 dark:bg-gray-800 border border-transparent dark:border-gray-700 rounded-full focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 focus:bg-white dark:focus:bg-gray-900 transition-all"
                        >
                    </div>
                </div>

                <!-- Dark Mode Toggle Button -->
                <div class="flex items-center gap-2">
                    <button 
                        id="theme-toggle" 
                        title="Ubah Tema"
                        class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none transition-colors"
                    >
                        <i data-lucide="moon" id="theme-toggle-dark-icon" class="w-5 h-5 hidden"></i>
                        <i data-lucide="sun" id="theme-toggle-light-icon" class="w-5 h-5 hidden"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Search Bar (Only visible on small screens) -->
            <div class="pb-3 sm:hidden">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="search-input-mobile"
                        placeholder="Cari foto..." 
                        class="w-full pl-9 pr-4 py-2 text-sm bg-gray-100 dark:bg-gray-800 border border-transparent dark:border-gray-700 rounded-full focus:outline-none focus:border-brand-500 focus:bg-white dark:focus:bg-gray-900 transition-all"
                    >
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Filter Category Tabs -->
        <section class="mb-8 overflow-x-auto pb-2 scrollbar-none">
            <div class="flex items-center justify-start sm:justify-center gap-2 min-w-max" id="category-filters">
                <button data-category="Semua" class="filter-btn active px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 bg-brand-500 text-white shadow-md">
                    Semua
                </button>
                <button data-category="Alam" class="filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700">
                    Alam
                </button>
                <button data-category="Arsitektur" class="filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700">
                    Arsitektur
                </button>
                <button data-category="Portrait" class="filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700">
                    Portrait
                </button>
                <button data-category="Makanan" class="filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700">
                    Makanan
                </button>
            </div>
        </section>

        <!-- Gallery Grid -->
        <section id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Photo Cards will be injected by JS -->
        </section>

        <!-- Empty State Message -->
        <div id="no-results" class="hidden text-center py-16">
            <div class="inline-flex p-4 rounded-full bg-gray-100 dark:bg-gray-800 mb-4">
                <i data-lucide="image-off" class="w-8 h-8 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-300">Tidak ada foto ditemukan</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Coba kata kunci lain atau pilih kategori yang berbeda.</p>
        </div>
    </main>

    <!-- Modal Lightbox -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 transition-opacity duration-300 opacity-0">
        <!-- Close Button -->
        <button id="close-lightbox" class="absolute top-4 right-4 z-10 p-2 text-white/80 hover:text-white rounded-full bg-black/40 hover:bg-black/60 transition-colors">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>

        <!-- Prev Button -->
        <button id="prev-lightbox" class="absolute left-4 top-1/2 -translate-y-1/2 z-10 p-3 text-white/80 hover:text-white rounded-full bg-black/40 hover:bg-black/60 transition-colors hidden sm:flex">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>

        <!-- Next Button -->
        <button id="next-lightbox" class="absolute right-4 top-1/2 -translate-y-1/2 z-10 p-3 text-white/80 hover:text-white rounded-full bg-black/40 hover:bg-black/60 transition-colors hidden sm:flex">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- Lightbox Content Container -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col md:flex-row shadow-2xl transition-all scale-95 duration-300" id="lightbox-card">
            
            <!-- Image Area -->
            <div class="md:w-2/3 bg-black flex items-center justify-center relative overflow-hidden min-h-[250px] md:min-h-[400px]">
                <img id="lightbox-img" src="" alt="" class="max-h-[70vh] md:max-h-[85vh] w-full object-contain">
            </div>

            <!-- Details Area -->
            <div class="md:w-1/3 p-6 flex flex-col justify-between bg-white dark:bg-gray-800 overflow-y-auto">
                <div>
                    <!-- Category Badge -->
                    <span id="lightbox-category" class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider text-brand-600 bg-brand-50 dark:bg-gray-700 dark:text-sky-400 rounded-full mb-3">
                        Kategori
                    </span>
                    
                    <!-- Title & Description -->
                    <h2 id="lightbox-title" class="text-xl font-bold text-gray-900 dark:text-white mb-2">
                        Judul Foto
                    </h2>
                    <p id="lightbox-desc" class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed mb-6">
                        Deskripsi detail mengenai foto ini akan tampil di bagian ini.
                    </p>

                    <!-- Meta Information -->
                    <div class="space-y-3 border-t border-gray-100 dark:border-gray-700 pt-4 text-xs text-gray-500 dark:text-gray-400">
                        <div class="flex items-center gap-2">
                            <i data-lucide="user" class="w-4 h-4 text-gray-400"></i>
                            <span>Fotografer: <strong id="lightbox-author" class="text-gray-700 dark:text-gray-300">Nama</strong></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="calendar" class="w-4 h-4 text-gray-400"></i>
                            <span>Tanggal: <span id="lightbox-date" class="text-gray-700 dark:text-gray-300">Date</span></span>
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="pt-6 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between mt-4">
                    <button id="lightbox-like-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400 font-medium text-sm hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors">
                        <i data-lucide="heart" class="w-4 h-4"></i>
                        <span id="lightbox-like-count">0</span> Suka
                    </button>

                    <!-- Mobile Next/Prev buttons -->
                    <div class="flex gap-2 sm:hidden">
                        <button id="prev-lightbox-mobile" class="p-2 text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <button id="next-lightbox-mobile" class="p-2 text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-6 transition-custom">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 dark:text-gray-400">
            <p>&copy; 2026 GaleriFoto. Dibuat dengan Tailwind CSS & JavaScript Vanilla.</p>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample Data Gallery
        const photos = [
            {
                id: 1,
                title: "Pegunungan Berkabut",
                category: "Alam",
                description: "Pemandangan pegunungan indah yang diselimuti kabut pagi yang tenang dan segar.",
                author: "Andi Wijaya",
                date: "12 Januari 2026",
                url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80",
                likes: 124
            },
            {
                id: 2,
                title: "Gedung Pencakar Langit",
                category: "Arsitektur",
                description: "Arsitektur modern gedung-gedung megah di pusat kota saat senja tiba.",
                author: "Siti Rahma",
                date: "05 Februari 2026",
                url: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80",
                likes: 89
            },
            {
                id: 3,
                title: "Potret Senyuman Bahagia",
                category: "Portrait",
                description: "Ekspresi kebahagiaan alami dengan pencahayaan hangat alami di luar ruangan.",
                author: "Budi Santoso",
                date: "20 Februari 2026",
                url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80",
                likes: 256
            },
            {
                id: 4,
                title: "Hidangan Ramen Lezat",
                category: "Makanan",
                description: "Semangkuk ramen hangat khas Jepang dengan topping lengkap yang menggugah selera.",
                author: "Rina Kartika",
                date: "01 Maret 2026",
                url: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=800&q=80",
                likes: 175
            },
            {
                id: 5,
                title: "Danau Cermin Biru",
                category: "Alam",
                description: "Keindahan air danau yang jernih memantulkan pemandangan langit dan pepohonan.",
                author: "Ahmad Rizki",
                date: "10 Maret 2026",
                url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
                likes: 310
            },
            {
                id: 6,
                title: "Jembatan Klasik Eropa",
                category: "Arsitektur",
                description: "Arsitektur jembatan batu bersejarah dengan keindahan detail ukiran yang megah.",
                author: "Diana Putri",
                date: "14 Maret 2026",
                url: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80",
                likes: 95
            },
            {
                id: 7,
                title: "Kopi Latte Art",
                category: "Makanan",
                description: "Secangkir kopi hangat dengan seni latte yang indah di atas meja kayu estetik.",
                author: "Fajar Nugraha",
                date: "18 Maret 2026",
                url: "https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=800&q=80",
                likes: 204
            },
            {
                id: 8,
                title: "Potret Dalam Bayangan",
                category: "Portrait",
                description: "Eksplorasi kontras cahaya dan bayangan pada fotografi potret yang dramatis.",
                author: "Budi Santoso",
                date: "22 Maret 2026",
                url: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80",
                likes: 142
            }
        ];

        // Application State
        let currentCategory = "Semua";
        let searchQuery = "";
        let currentPhotoIndex = 0;
        let filteredPhotos = [...photos];

        // DOM Elements
        const galleryGrid = document.getElementById("gallery-grid");
        const noResults = document.getElementById("no-results");
        const searchInput = document.getElementById("search-input");
        const searchInputMobile = document.getElementById("search-input-mobile");
        const filterBtns = document.querySelectorAll(".filter-btn");

        // Lightbox Elements
        const lightboxModal = document.getElementById("lightbox-modal");
        const lightboxCard = document.getElementById("lightbox-card");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxTitle = document.getElementById("lightbox-title");
        const lightboxDesc = document.getElementById("lightbox-desc");
        const lightboxCategory = document.getElementById("lightbox-category");
        const lightboxAuthor = document.getElementById("lightbox-author");
        const lightboxDate = document.getElementById("lightbox-date");
        const lightboxLikeCount = document.getElementById("lightbox-like-count");
        const lightboxLikeBtn = document.getElementById("lightbox-like-btn");
        const closeLightboxBtn = document.getElementById("close-lightbox");
        const prevLightboxBtn = document.getElementById("prev-lightbox");
        const nextLightboxBtn = document.getElementById("next-lightbox");
        const prevLightboxMobile = document.getElementById("prev-lightbox-mobile");
        const nextLightboxMobile = document.getElementById("next-lightbox-mobile");

        // --- STREAMING_CHUNK:Defining Render & Interactive Functions... ---
        
        // Render Gallery Cards
        function renderGallery() {
            // Filter logic
            filteredPhotos = photos.filter(photo => {
                const matchesCategory = currentCategory === "Semua" || photo.category === currentCategory;
                const matchesSearch = photo.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      photo.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      photo.author.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            galleryGrid.innerHTML = "";

            if (filteredPhotos.length === 0) {
                noResults.classList.remove("hidden");
            } else {
                noResults.classList.add("hidden");
                
                filteredPhotos.forEach((photo, index) => {
                    const card = document.createElement("div");
                    card.className = "group relative bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col cursor-pointer border border-gray-100 dark:border-gray-700/50";
                    
                    card.innerHTML = `
                        <div class="relative aspect-4/3 overflow-hidden bg-gray-200 dark:bg-gray-700">
                            <img 
                                src="${photo.url}" 
                                alt="${photo.title}" 
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out"
                                loading="lazy"
                            >
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                                <span class="text-xs text-white/90 bg-black/40 backdrop-blur-md px-3 py-1 rounded-full">
                                    ${photo.category}
                                </span>
                            </div>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-grow">
                            <div>
                                <h3 class="font-bold text-gray-800 dark:text-gray-100 text-base line-clamp-1 group-hover:text-brand-500 dark:group-hover:text-sky-400 transition-colors">
                                    ${photo.title}
                                </h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">
                                    ${photo.description}
                                </p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700/50 flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
                                <span>Oleh <strong class="text-gray-700 dark:text-gray-300">${photo.author}</strong></span>
                                <button 
                                    class="like-btn flex items-center gap-1.5 hover:text-red-500 transition-colors p-1"
                                    data-id="${photo.id}"
                                >
                                    <i data-lucide="heart" class="w-4 h-4 fill-transparent stroke-current"></i>
                                    <span>${photo.likes}</span>
                                </button>
                            </div>
                        </div>
                    `;

                    // Open Lightbox Event on Card Click
                    card.addEventListener("click", (e) => {
                        if (!e.target.closest(".like-btn")) {
                            openLightbox(index);
                        }
                    });

                    // Like Button Event
                    const likeBtn = card.querySelector(".like-btn");
                    likeBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        toggleLike(photo.id);
                    });

                    galleryGrid.appendChild(card);
                });
            }

            // Re-initialize icons
            lucide.createIcons();
        }

        // Toggle Like functionality
        function toggleLike(id) {
            const photo = photos.find(p => p.id === id);
            if (photo) {
                photo.likes += 1;
                renderGallery();
                
                // If Lightbox is open, update its counter as well
                if (!lightboxModal.classList.contains("hidden") && filteredPhotos[currentPhotoIndex]?.id === id) {
                    lightboxLikeCount.textContent = photo.likes;
                }
            }
        }

        // Lightbox Handler
        function openLightbox(index) {
            currentPhotoIndex = index;
            const photo = filteredPhotos[currentPhotoIndex];

            if (!photo) return;

            lightboxImg.src = photo.url;
            lightboxTitle.textContent = photo.title;
            lightboxDesc.textContent = photo.description;
            lightboxCategory.textContent = photo.category;
            lightboxAuthor.textContent = photo.author;
            lightboxDate.textContent = photo.date;
            lightboxLikeCount.textContent = photo.likes;

            lightboxModal.classList.remove("hidden");
            setTimeout(() => {
                lightboxModal.classList.remove("opacity-0");
                lightboxCard.classList.remove("scale-95");
                lightboxCard.classList.add("scale-100");
            }, 10);

            // Re-assign Like Button for Lightbox
            lightboxLikeBtn.onclick = () => toggleLike(photo.id);
        }

        function closeLightbox() {
            lightboxModal.classList.add("opacity-0");
            lightboxCard.classList.remove("scale-100");
            lightboxCard.classList.add("scale-95");
            setTimeout(() => {
                lightboxModal.classList.add("hidden");
            }, 300);
        }

        function navigateLightbox(direction) {
            currentPhotoIndex += direction;
            if (currentPhotoIndex < 0) currentPhotoIndex = filteredPhotos.length - 1;
            if (currentPhotoIndex >= filteredPhotos.length) currentPhotoIndex = 0;
            openLightbox(currentPhotoIndex);
        }

        // --- STREAMING_CHUNK:Setting Up Event Listeners & Dark Mode... ---

        // Category Filter Click Event
        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                filterBtns.forEach(b => {
                    b.classList.remove("bg-brand-500", "text-white", "shadow-md");
                    b.classList.add("bg-white", "dark:bg-gray-800", "text-gray-600", "dark:text-gray-300", "border", "border-gray-200", "dark:border-gray-700");
                });

                btn.classList.remove("bg-white", "dark:bg-gray-800", "text-gray-600", "dark:text-gray-300", "border", "border-gray-200", "dark:border-gray-700");
                btn.classList.add("bg-brand-500", "text-white", "shadow-md");

                currentCategory = btn.getAttribute("data-category");
                renderGallery();
            });
        });

        // Search Input Events
        const handleSearch = (e) => {
            searchQuery = e.target.value;
            renderGallery();
        };

        searchInput.addEventListener("input", handleSearch);
        searchInputMobile.addEventListener("input", handleSearch);

        // Lightbox Navigation Events
        closeLightboxBtn.addEventListener("click", closeLightbox);
        prevLightboxBtn.addEventListener("click", () => navigateLightbox(-1));
        nextLightboxBtn.addEventListener("click", () => navigateLightbox(1));
        prevLightboxMobile.addEventListener("click", () => navigateLightbox(-1));
        nextLightboxMobile.addEventListener("click", () => navigateLightbox(1));

        // Close Lightbox on Background Click
        lightboxModal.addEventListener("click", (e) => {
            if (e.target === lightboxModal) closeLightbox();
        });

        // Keyboard Navigation for Lightbox
        document.addEventListener("keydown", (e) => {
            if (lightboxModal.classList.contains("hidden")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") navigateLightbox(-1);
            if (e.key === "ArrowRight") navigateLightbox(1);
        });

        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // Initial Load
        window.addEventListener("DOMContentLoaded", () => {
            renderGallery();
        });
    </script>
</body>
</html>
